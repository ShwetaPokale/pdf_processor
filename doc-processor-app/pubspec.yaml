name: doc_processor_app
description: A document processing application with PDF analysis capabilities.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  provider: ^6.0.5
  flutter_markdown: ^0.6.18
  shared_preferences: ^2.2.2
  dio: ^5.3.3
  flutter_spinkit: ^5.2.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ 